<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste de som · Princesa Sofia</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="ui/audio-lab.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>Teste de som</h1>
      <p>Ouve cada momento do jogo e escolhe a versão de que gostas. Os sons tocam com o mesmo ambiente sonoro do jogo (reverberação e volumes). Liga a música de fundo para os ouvires no contexto real.</p>
    </div>
    <div class="bar">
      <label class="field">Volume <input id="volume" type="range" min="0" max="100" value="60"></label>
      <label class="field">Música de fundo
        <select id="music">
          <option value="">Sem música</option>
          <option value="theme-base">Jogo normal</option>
          <option value="theme-hunt">Bonus Hunt</option>
          <option value="theme-bonus-common">Jardim Encantado</option>
          <option value="theme-bonus-super">Baile ao Luar</option>
          <option value="theme-bonus-secret">Coroa da Aurora</option>
        </select>
      </label>
      <div class="field">Escolher para todos
        <div class="chips" id="all-family"></div>
      </div>
      <button id="simulate" class="ghost" type="button">▶ Simular um spin com as escolhas</button>
      <button id="save" class="primary" type="button">Guardar e aplicar ao jogo</button>
      <span id="status" class="status" role="status"></span>
    </div>
    <ul class="legend" id="legend"></ul>
  </header>
  <main id="groups"></main>
  <script type="module" src="ui/audio-lab.js"></script>
</body>
</html>
