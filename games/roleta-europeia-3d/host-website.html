<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./dist/sdk/roleta.css"><div id="host-error" role="alert"></div><div id="host-game"></div><script type="module">import {mount,createHttpWallet} from './dist/sdk/roleta.js';const config=window.ATELIER_WEBSITE;if(!config?.playerId||!config?.balanceUrl||!config?.settleUrl){document.getElementById('host-error').textContent='O website deve fornecer window.ATELIER_WEBSITE com playerId, balanceUrl, settleUrl e CSRF. Ver INTEGRAR_COM_AI.md.';}else{const wallet=createHttpWallet({game:'roulette',balanceUrl:config.balanceUrl,settleUrl:config.settleUrl,headers:()=>config.csrfToken?{'X-CSRF-Token':config.csrfToken}:{}});const handle=mount(document.getElementById('host-game'),{mode:'integrated',playerId:String(config.playerId),wallet});window.game=handle;handle.ready.catch(e=>document.getElementById('host-error').textContent=e.message);}</script></html>
