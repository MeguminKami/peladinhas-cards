<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./dist/sdk/blackjack.css"><div id="host-game"></div><script type="module">import {mount} from './dist/sdk/blackjack.js';const key='example-blackjack-wallet';let w=JSON.parse(localStorage.getItem(key)||'{"balance":100000,"receipts":{}}');mount(document.getElementById('host-game'),{playerId:'host-demo',wallet:{async getBalance(){return w.balance;},async settle(op){if(w.receipts[op.id])return w.receipts[op.id];if(w.balance<op.debit)throw new Error('Saldo insuficiente');w.balance=w.balance-op.debit+op.credit;const r={balance:w.balance};w.receipts[op.id]=r;localStorage.setItem(key,JSON.stringify(w));return r;}}});</script></html>
