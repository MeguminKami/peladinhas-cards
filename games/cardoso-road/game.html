<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111323"><title>Cardoso Road — Fuga ao Óleo</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="embed.css"></head><body>
<main class="game">
 <header><h1>CARDOSO <em>ROAD</em><span>FUGA AO ÓLEO</span></h1><span class="demo">DEMONSTRAÇÃO</span><div class="wallet"><small>CRÉDITOS FICTÍCIOS</small><strong id="balance">1 000,00</strong></div></header>
 <section class="arena" aria-label="Circuito do ginásio com dez etapas"><div class="scene-top"><span id="place">ENTRADA DO GINÁSIO</span><div class="journey"><span>O CAMINHO ATÉ À SOFIA</span><div id="markers" role="progressbar" aria-label="Etapas concluídas" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"></div></div></div><canvas id="world" aria-label="Cardoso e a coluna JBL avançam pelo ginásio"></canvas><div class="scene-bottom"><span>ZERO ÓLEO. SÓ GAINS.</span><span id="progress">TREINO POR COMEÇAR · 0 / 10</span></div></section>
 <div class="round-strip"><span>ATUAL <strong id="current">1,00×</strong></span><span>PRÓXIMO <b id="next">1,10×</b><small id="potential">11,02 créditos</small></span><span id="success">88% de sucesso</span><span class="target-info">META <b id="finish">3,48×</b></span><button id="victory-result" data-panel="victory" hidden>Ver prémio recebido ↗</button><button data-panel="rules">Regras e probabilidades ↗</button></div>
 <section class="console" aria-label="Controlos do treino">
 <div class="stake"><label for="bet">APOSTA <small id="limits">1 – 100 créditos</small></label><div class="bet-input"><button data-bet="minus" aria-label="Diminuir aposta">−</button><input id="bet" inputmode="decimal" value="10,00" aria-describedby="limits"><button data-bet="plus" aria-label="Aumentar aposta">+</button></div><div class="bet-tools"><button data-bet="min">MIN</button><button data-bet="half">½</button><button data-bet="double">2×</button><button data-bet="max">MAX</button></div></div>
 <div class="difficulty"><label>DIFICULDADE</label><div id="modes" role="group" aria-label="Dificuldade"></div></div>
 <div class="risk"><label>RISCO DE FALHA</label><strong id="risk">12%</strong><small>por passo</small></div>
 <button id="cashout" class="cashout" disabled><span>CASH OUT</span><strong>0,00</strong><small>créditos</small></button><button id="play" class="primary">Apostar</button>
 </section><p id="error" class="error" role="alert"></p>
 
 <footer><div class="music-control" role="group" aria-label="Música do jogo"><button id="music-toggle" aria-pressed="true">Música ligada</button><label for="music-volume">Volume</label><input id="music-volume" type="range" min="0" max="1" step=".01" value=".3"><output id="music-level" for="music-volume">30%</output></div><nav class="footer-tools" aria-label="Opções do jogo"><button data-panel="rules">Regras</button><button data-panel="history">Histórico</button><button data-panel="settings">Definições</button><button data-panel="help">Ajuda</button></nav></footer>
</main><dialog id="panel"><button id="close" aria-label="Fechar janela">✕</button><div id="panel-body"></div></dialog><script type="module" src="boot.mjs"></script></body></html>
